name: deploy

# Push to main → build, then deploy the Cloud Run API and the Firebase-hosted
# frontend (HANDOFF-BRIEF-ai-video-app.md §3). Auth via Workload Identity
# Federation — no long-lived service-account JSON in GitHub secrets.
#
# Required repo configuration (set once, see docs/HANDOFF-BRIEF-ai-video-app.md):
#   vars:    GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOY_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID
#   secrets: (none needed for WIF; GOOGLE_API_KEY is set on the Cloud Run service, not here)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @ava/shared
      - run: npm test --workspace @ava/shared
      - run: npm run typecheck
      - run: npm run build --workspace @ava/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 4Gi / 2 vCPU: stitching a long 1080p video runs ffmpeg with several 1080p
      # decoders, overlays and an encoder at once. At 1Gi the instance was killed
      # mid-run ("Memory limit of 1024 MiB exceeded"), which the browser only sees
      # as "Failed to fetch". Billing is per request-second, so idle costs nothing.
      - name: Deploy API (Cloud Run)
        run: |
          gcloud run deploy ava-api \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --timeout 3600 \
            --memory 4Gi \
            --cpu 2 \
            --concurrency 4 \
            --max-instances 3 \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:${{ vars.GOOGLE_API_KEY_VERSION }}" \
            --set-env-vars "ALLOW_ORIGIN=https://${{ vars.FIREBASE_PROJECT_ID }}.web.app,OWNER_EMAILS=${{ vars.OWNER_EMAILS }}" \
            --quiet
          RUN_URL=$(gcloud run services describe ava-api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "VITE_API_URL=$RUN_URL" >> "$GITHUB_ENV"
          echo "Frontend will call the API directly at $RUN_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build the frontend to call Cloud Run directly — Firebase Hosting caps
      # requests at 60s, which is too short for a multi-part generation.
      - run: npm run build --workspace @ava/shared && npm run build --workspace @ava/web
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Deploy frontend + rules (Firebase)
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting,firestore:rules,storage \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --non-interactive
